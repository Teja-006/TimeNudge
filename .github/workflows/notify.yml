name: Timetable notifier

on:
  schedule:
    # Several runs a day. Each one queues messages with ntfy up to 3 days ahead,
    # and repeat runs skip anything already queued, so lateness doesn't matter.
    - cron: "30 0 * * *"    # 06:00 IST
    - cron: "30 6 * * *"    # 12:00 IST
    - cron: "30 10 * * *"   # 16:00 IST
    - cron: "30 14 * * *"   # 20:00 IST
  workflow_dispatch:   # lets you run it manually from the Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python notify.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}